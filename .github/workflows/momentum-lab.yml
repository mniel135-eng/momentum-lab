name: Momentum Lab

on:
  schedule:
    # 23:00 UTC Mon-Fri = 18:00 ET, safely after the US close year-round.
    - cron: "0 23 * * 1-5"
  workflow_dispatch:          # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    # A push made with KEEPALIVE_TOKEN *does* retrigger workflows (unlike one made
    # with GITHUB_TOKEN), so the nightly result commit must never trigger this
    # workflow again. Two independent guards: these paths-ignore entries cover
    # every file the run writes, and the commit message carries [skip ci].
    paths-ignore:
      - "ledgers/**"
      - "reports/**"
      - "logs/**"
      - "dashboard.html"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: momentum-lab
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      # GitHub disables scheduled workflows in a PUBLIC repo after 60 days of
      # repository inactivity, and the docs do not promise that commits made with
      # the default GITHUB_TOKEN count as activity. Pushing with a user-owned
      # fine-grained PAT (secret KEEPALIVE_TOKEN) makes each nightly commit
      # user-attributed, which does count, so the 60-day clock never runs out.
      # If the secret is absent this falls back to the default token and the job
      # still works - it just needs manual re-enabling roughly every 60 days.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.KEEPALIVE_TOKEN || github.token }}

      - name: Report which credential is in use
        run: |
          if [ -n "${{ secrets.KEEPALIVE_TOKEN }}" ]; then
            echo "::notice title=Keepalive::Pushing as the repository owner (KEEPALIVE_TOKEN). The 60-day scheduled-workflow timer stays reset."
          else
            echo "::warning title=Keepalive missing::No KEEPALIVE_TOKEN secret. Commits are made by github-actions[bot], which may not count as repository activity, so GitHub may disable this schedule after 60 days of inactivity."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet "yfinance==1.8.0" pandas numpy

      - name: Replay all ledgers from scratch
        run: python lab.py

      - name: Commit updated ledgers and report
        run: |
          git config user.name  "mniel135-eng"
          git config user.email "mniel135-eng@users.noreply.github.com"
          git add -A ledgers reports logs dashboard.html
          if git diff --staged --quiet; then
            echo "No change in results."
          else
            git commit -m "Run $(date -u +%Y-%m-%d): refresh ledgers, report and dashboard [skip ci]"
            git push
          fi

      - name: Assemble the published site
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html
          cp -r reports _site/reports
          cp -r ledgers _site/ledgers
          cp RULES.md README.md _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publish:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
